<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Голова змеи -->
  <rect x="8" y="8" width="16" height="16" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Глаза змеи -->
  <rect x="10" y="10" width="2" height="2" fill="#ffffff"/>
  <rect x="20" y="10" width="2" height="2" fill="#ffffff"/>
  
  <!-- Нос змеи -->
  <rect x="15" y="12" width="2" height="1" fill="#ffffff"/>
  
  <!-- Рот змеи -->
  <rect x="12" y="14" width="8" height="1" fill="#ffffff"/>
  
  <!-- Язык змеи -->
  <rect x="14" y="15" width="1" height="2" fill="#ffffff"/>
  <rect x="17" y="15" width="1" height="2" fill="#ffffff"/>
  
  <!-- Тело змеи (хвост) -->
  <rect x="6" y="12" width="4" height="8" fill="#000000" stroke="#ffffff" stroke-width="1"/>
  <rect x="4" y="14" width="4" height="4" fill="#000000" stroke="#ffffff" stroke-width="1"/>
</svg>
